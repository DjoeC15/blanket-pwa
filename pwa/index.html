<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1c1c2a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Blanket">
  <title>Blanket</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <!-- Top Bar -->
    <header class="topbar">
      <div class="topbar-left">
        <span class="app-icon">🌿</span>
        <h1 class="app-title">Blanket</h1>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" id="presetsBtn" aria-label="Presets">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Sound Grid -->
    <main class="content" id="soundGrid"></main>

    <!-- Bottom Bar -->
    <footer class="bottombar">
      <div class="master-vol">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        </svg>
        <input type="range" id="masterVolume" min="0" max="100" value="80" aria-label="Master volume">
      </div>

      <button class="play-btn" id="playBtn" aria-label="Play / Pause">
        <svg id="playIcon" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        <svg id="pauseIcon" class="hidden" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
        </svg>
      </button>

      <button class="icon-btn" id="savePresetBtn" aria-label="Save preset">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
      </button>
    </footer>

  </div>

  <!-- Presets Modal -->
  <div class="modal-overlay hidden" id="presetsModal">
    <div class="modal">
      <div class="modal-header">
        <h2>Presets</h2>
        <button class="icon-btn" id="closePresetsBtn" aria-label="Close">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="preset-list" id="presetList"></div>
    </div>
  </div>

  <!-- Save Preset Modal -->
  <div class="modal-overlay hidden" id="saveModal">
    <div class="modal">
      <div class="modal-header">
        <h2>Save Preset</h2>
        <button class="icon-btn" id="closeSaveBtn" aria-label="Close">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <input type="text" id="presetNameInput" class="text-input" placeholder="Preset name…" maxlength="30" autocomplete="off">
      <button class="btn-primary" id="confirmSaveBtn">Save</button>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Sélecteur de fichier audio (caché, déclenché par la carte +) -->
  <input type="file" id="customSoundFile" accept="audio/*" style="display:none">

  <script src="audio-engine.js"></script>
  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-mode="dark" data-palette="navy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#070f1f">
  <meta name="color-scheme" content="dark light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Blanket">
  <title>Blanket</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="fonts/material-symbols-rounded.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script>
    // Appliqué avant le premier rendu : sans ça l'app flashe dans le thème
    // par défaut avant que app.js ne lise les préférences.
    (function () {
      var d = document.documentElement;
      try {
        var ui = JSON.parse(localStorage.getItem('blanket_ui')) || {};
        if (ui.mode)    d.dataset.mode    = ui.mode;
        if (ui.palette) d.dataset.palette = ui.palette;
        if (ui.black)   d.dataset.black   = '';
      } catch (_) {}
    })();
  </script>
</head>
<body>

  <!-- Écran de chargement : prend le relais du splash natif, disparaît quand
       l'état est restauré. -->
  <div class="splash" id="splash" aria-hidden="true">
    <img class="splash-logo" src="icons/icon-192.png" alt="" width="96" height="96">
    <div class="splash-name">Blanket</div>
    <div class="linear-progress"><span></span></div>
  </div>

  <div class="status-scrim" id="statusScrim"></div>

  <main class="app-scroll" id="scroll">
    <header class="top-app-bar" id="topBar">
      <div class="small-title">Blanket</div>
      <div class="app-actions">
        <button class="icon-button pressable" id="timerBtn" data-i18n-label="sleepTimer">
          <span class="icon">bedtime</span>
        </button>
        <button class="icon-button pressable" id="moreBtn" data-i18n-label="moreOptions">
          <span class="icon">more_vert</span>
        </button>
      </div>
      <h1>Blanket</h1>
    </header>

    <section class="now-playing">
      <h2 class="section-label" data-i18n="nowPlaying"></h2>
      <div class="active-chips" id="activeChips"></div>
    </section>

    <nav class="filter-row" id="filters" aria-label="Sound categories"></nav>

    <div class="sound-groups" id="soundGroups"></div>
  </main>

  <footer class="bottom-player">
    <div class="master">
      <span class="icon" id="masterIcon">volume_up</span>
      <div class="master-track">
        <input type="range" class="m3-slider" id="masterVolume" min="0" max="100" value="80" data-i18n-label="masterVolume">
        <span class="timer-label hidden" id="timerLabel"></span>
      </div>
    </div>
    <button class="icon-button pressable mixes-button" id="mixesBtn" data-i18n-label="mixes">
      <span class="icon">library_music</span>
    </button>
    <button class="fab pressable" id="playBtn" aria-label="Play">
      <span class="icon filled" id="playIcon">play_arrow</span>
    </button>
  </footer>

  <div class="snackbar" id="snackbar" role="status" aria-live="polite">
    <span id="snackbarText"></span>
    <button class="snackbar-action pressable hidden" id="snackbarAction"></button>
  </div>

  <input type="file" id="customSoundFile" accept="audio/*" hidden>

  <script src="i18n.js"></script>
  <script src="audio-engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
